<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Wi-Fi</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Configurar Wi-Fi</h1>

    <form id="connection-form">
      <label for="ssid">Rede Wi-Fi</label>
      <div class="network-row">
        <select id="ssid" name="ssid" required>
          <option value="">Carregando redes...</option>
        </select>
        <button id="refresh" type="button" aria-label="Atualizar redes">↻</button>
      </div>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password">

      <button class="submit" type="submit">conectar</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="/ap.js" defer></script>
</body>
</html>
